[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Autonomous Kalshi trading bot"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "feedparser>=6.0.11",
    "httpx>=0.28.0",
    "kalshi-python-sync>=3.2.0",
    "websockets>=14.0",
    "discord.py>=2.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.33.1",
    "scipy>=1.15.3",
    "websocket-client>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
